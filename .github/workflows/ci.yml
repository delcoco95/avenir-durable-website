name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avenir
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: avenir_durable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avenir" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://avenir:ci-only-password@localhost:5432/avenir_durable_test
      TEST_DATABASE_URL: postgres://avenir:ci-only-password@localhost:5432/avenir_durable_test
      SESSION_SECRET: ci-only-secret-0123456789abcdef
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
