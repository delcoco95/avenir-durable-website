# Publie le site public (dossier www) sur la branche gh-pages, servie par GitHub Pages,
# à chaque envoi sur main. GitHub Pages n'exécute pas PHP : l'administration n'y est pas publiée
# (elle fonctionne chez un hébergeur PHP ou en local avec lancer-en-local.bat).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site statique
        run: bash outils/preparer-github-pages.sh _site
      - name: Envoyer sur la branche gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
